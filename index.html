<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>업무 공유 대시보드</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ===== 사이드바 ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">W</span>
        <span class="brand-name">워크보드</span>
      </div>

      <nav class="nav">
        <div class="nav-group">
          <div class="nav-group-label">메인</div>
          <a class="nav-item" href="#home" data-view="home"><span class="nav-icon">🏠</span>홈</a>
          <a class="nav-item" href="#board" data-view="board"><span class="nav-icon">📋</span>업무 보드<span class="nav-badge" id="nav-badge-board"></span></a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">프로젝트</div>
          <a class="nav-item" href="#rocket" data-view="rocket"><span class="nav-icon">🚀</span>로켓그로스</a>
          <a class="nav-item" href="#products" data-view="products"><span class="nav-icon">📦</span>상품 관리</a>
          <a class="nav-item" href="#marketing" data-view="marketing"><span class="nav-icon">⭐</span>마케팅 · 리뷰</a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">콘텐츠 스튜디오</div>
          <a class="nav-item" href="#blog" data-view="blog"><span class="nav-icon">✍️</span>블로그 글쓰기</a>
          <a class="nav-item" href="#reels" data-view="reels"><span class="nav-icon">🎬</span>릴스</a>
          <a class="nav-item" href="#shorts" data-view="shorts"><span class="nav-icon">📱</span>쇼츠</a>
          <a class="nav-item" href="#threads" data-view="threads"><span class="nav-icon">🧵</span>쓰레드</a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">관리</div>
          <a class="nav-item" href="#personas" data-view="personas"><span class="nav-icon">🎭</span>페르소나</a>
          <a class="nav-item" href="#settings" data-view="settings"><span class="nav-icon">⚙️</span>설정</a>
        </div>
      </nav>

      <div class="sidebar-foot">NAS 공유 대시보드 · v0.1</div>
    </aside>
    <div class="sidebar-dim" id="sidebar-dim"></div>

    <!-- ===== 메인 ===== -->
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="메뉴 열기">☰</button>
        <div class="topbar-title">
          <h1 id="page-title">홈</h1>
          <span class="topbar-date" id="topbar-date"></span>
        </div>
        <button id="add-task-btn" class="btn btn-primary">+ 새 업무</button>
      </header>

      <main class="view" id="view"></main>
    </div>
  </div>

  <!-- ===== 업무 등록/수정 모달 ===== -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title">새 업무</h2>
      <form id="task-form">
        <label>
          제목
          <input type="text" id="task-title" required maxlength="120" />
        </label>
        <label>
          담당자
          <input type="text" id="task-assignee" required maxlength="40" placeholder="예: 대표, 직원" list="assignee-list" />
          <datalist id="assignee-list"></datalist>
        </label>
        <label>
          설명
          <textarea id="task-description" rows="3" maxlength="500"></textarea>
        </label>
        <div class="form-row">
          <label>
            상태
            <select id="task-status">
              <option value="todo">할 일</option>
              <option value="progress">진행중</option>
              <option value="done">완료</option>
            </select>
          </label>
          <label>
            우선순위
            <select id="task-priority">
              <option value="high">높음</option>
              <option value="medium" selected>보통</option>
              <option value="low">낮음</option>
            </select>
          </label>
        </div>
        <label>
          마감일
          <input type="date" id="task-due" />
        </label>
        <div class="modal-actions">
          <button type="button" id="delete-task-btn" class="btn btn-danger hidden">삭제</button>
          <div class="modal-actions-right">
            <button type="button" id="cancel-btn" class="btn btn-secondary">취소</button>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
